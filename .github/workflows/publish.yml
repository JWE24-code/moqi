name: Publish to npm

# Publishing is triggered by publishing a GitHub Release, not by a push to
# main. A push cannot publish safely: npm rejects a version that already
# exists, so every push would need a version bump first, and a workflow that
# bumps for you turns an ordinary merge into a release nobody decided on.
# Cutting a Release is that decision, and it is the one action that should
# put a tarball on the registry.
on:
  release:
    types: [published]
  # Manual runs exist for re-publishing a release whose job failed, and for
  # the dry run that stops before the registry.
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and gate the artifact, but do not publish
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for npm trusted publishing (OIDC): the registry accepts the
      # workflow's identity in place of a long-lived token, and the same
      # identity signs the provenance attestation.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; Node 24 ships a recent npm but
      # not necessarily that recent, and neither the registry nor provenance
      # works on an older CLI.
      - run: npm install -g --ignore-scripts npm@12.2.0

      # `prepublishOnly` below runs the typecheck, which compiles against the
      # real Harness packages — so they have to be present and linked here,
      # exactly as the typecheck job in ci.yml does it.
      - run: npm install -g --ignore-scripts @deepseek-ai/dsh # NOSONAR — the release typecheck deliberately runs against the published latest dsh.
      # The profile installer inside `test:package` composes `link:` deps,
      # which npm rejects with EUNSUPPORTEDPROTOCOL — the same reason a dev
      # checkout needs pnpm. Without it the release gate fails on a machine
      # difference rather than a broken artifact.
      - run: npm install -g pnpm # NOSONAR — pnpm's own preinstall/postinstall places its platform binary; --ignore-scripts would break it.
      - run: npm ci --ignore-scripts
      - run: npm run link-types

      # The release tag and the manifest must agree, or the registry ends up
      # with a version nobody named. `github.ref_name` is the tag for a
      # release event, and the branch for a manual run, in which case the
      # manifest is the only source of truth.
      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${{ github.ref_name }}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "${tag#v}" != "$manifest" ]; then
            echo "release tag $tag does not match package.json $manifest" >&2
            exit 1
          fi

      # A re-run of an already-published release is a success, not a failure:
      # the artifact is on the registry either way, and a red X for a version
      # that shipped teaches people to ignore red Xs.
      - name: Is this version already published?
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "moqi-tui@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "moqi-tui@$version is already on the registry — nothing to do"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # `prepublishOnly` runs the full gate — build, typecheck, npm test, and
      # the packed-artifact check — so nothing reaches the registry that has
      # not installed and booted from its own tarball.
      - name: Publish
        if: steps.published.outputs.already == 'false' && inputs.dry-run != true
        run: npm publish --provenance --access public

      - name: Dry run (gate and pack, publish nothing)
        if: steps.published.outputs.already == 'false' && inputs.dry-run == true
        # Deliberately not `npm publish --dry-run`: that exports
        # npm_config_dry_run, which the nested `npm pack` inside test:package
        # inherits and honours by writing no tarball — so the gate would fail
        # on its own environment rather than on the artifact. Run the gate and
        # list the tarball contents instead, and never reach the registry.
        run: |
          npm run test:package
          npm pack --dry-run
