name: CI

on:
  push:
  pull_request:

jobs:
  # GitHub only parses a workflow when it runs, so a scheduled or manual one
  # with a bad expression fails first after merge. actionlint catches that on
  # the pull request. Shell scripts inside `run:` are left to review.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck=

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      # A plugin that lists `@deepseek-ai/*` under `dependencies` puts its own
      # core copy in the profile, which shadows the harness's and kills startup
      # (deepseek-harness #10364). They must stay optional peers.
      - name: Check no Harness package is a runtime dependency
        run: node scripts/check-harness-deps.mjs
      # No Harness is installed here on purpose: the suites are dependency-free,
      # so `@deepseek-ai/*` must not resolve, and a suite that reaches for it
      # fails to load at all. `tests/offline-imports-smoke.ts` enforces that
      # from inside `npm test`, so the violation also shows up in a development
      # checkout, where `npm run link-types` would otherwise hide it.
      # A full `npm run build` does need those packages linked, which is what
      # the typecheck job below is for.
      - run: npm test
      # The pty harness drives the real Screen through a pseudo-terminal via
      # util-linux script(1); it skips itself cleanly where that is absent.
      - run: npm run test:pty

  # SonarCloud CI-based analysis, so Sonar sees test coverage — Automatic
  # Analysis cannot import it (sonar-project.properties holds the scope).
  # A pull request from a fork gets no secrets, so the scan steps skip there
  # rather than fail; its tests still run in the `test` job.
  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Blame data for new-code detection and issue assignment.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

  # Compile the Harness-typed files (src/index.ts, src/startup.ts) against the
  # real @deepseek-ai packages, which `npm test` never touches because src/tui/
  # is dependency-free. This is the only gate that catches upstream API drift,
  # so it runs against both supported dsh lines: `latest` and `next`.
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dsh: [latest, next]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Resolve the dist-tag to an exact version, then install that pinned.
      - name: Install dsh
        env:
          DSH_TAG: ${{ matrix.dsh }}
        run: |
          DSH_VERSION="$(npm view "@deepseek-ai/dsh@${DSH_TAG}" version)"
          echo "dsh ${DSH_TAG} is $DSH_VERSION"
          npm install -g --ignore-scripts "@deepseek-ai/dsh@${DSH_VERSION}"
      - run: npm ci --ignore-scripts
      - run: npm run link-types
      - run: npm run typecheck

  # Install the packed package the way a user does, on every OS, against the
  # current dsh: global dsh, global moqi, `moqi install` into a fresh
  # DSH_HOME, then boot the profile far enough to dump its config. Windows is
  # the point: npm's shims there are `.cmd` files and there is no /bin/sh.
  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check no Harness package is a runtime dependency
        run: node scripts/check-harness-deps.mjs
      # Install scripts are skipped, as npm 11 does by default: dsh's only
      # fix a macOS pty helper bit, which booting to --dump-config never needs.
      # The dist-tag is resolved to an exact version first, so every run still
      # tests whatever `latest` is today but installs a pinned version.
      - name: Install dsh
        run: |
          DSH_VERSION="$(npm view @deepseek-ai/dsh@latest version)"
          echo "dsh latest is $DSH_VERSION"
          npm install -g --ignore-scripts "@deepseek-ai/dsh@${DSH_VERSION}"
      # The Harness manages profiles (and plugins) with pnpm. 10.x is plain
      # JavaScript; 11+ ships a native binary that needs its install script.
      - name: Install pnpm
        run: npm install -g --ignore-scripts pnpm@10.34.7
      - name: Pack and install moqi
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g --ignore-scripts "$RUNNER_TEMP"/moqi-tui-*.tgz
      - name: moqi install, then boot the profile
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          cd "$RUNNER_TEMP"
          moqi install
          dsh --profile tui --dump-config > /dev/null
          moqi --dump-config > /dev/null
          moqi --help
          # A plugin's own @deepseek-ai copy in the profile shadows the
          # harness's (deepseek-harness #10364); there must be none.
          node -e "
            const { existsSync, readdirSync } = require('node:fs')
            const dir = require('node:path').join(process.env.DSH_HOME, 'profiles', 'tui', 'node_modules', '@deepseek-ai')
            const found = existsSync(dir) ? readdirSync(dir) : []
            if (found.length > 0) { console.error('stale harness copies in the profile:', found.join(', ')); process.exit(1) }
            console.log('profile has no @deepseek-ai copies')
          "

  # Commit metadata is the one place a personal address can leak without ever
  # appearing in a file: an editor or a machine with a work or personal
  # `user.email` writes it into every commit it creates, and review never shows
  # it. Only the commits a push or pull request adds are checked — the history
  # already published would fail forever, and a gate that is always red is a
  # gate everyone learns to ignore.
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The range spans commits that may predate this checkout.
          fetch-depth: 0
      - name: Check commit identities
        run: |
          # On a pull request, `github.sha` is the merge commit GitHub
          # synthesises for the PR, and that commit carries the account's
          # email rather than the author's — checking it would fail on
          # something no commit here can change. The branch tip is what the
          # author actually wrote.
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              # A branch's first push reports an all-zero "before"; there is
              # no parent to compare against, so the new tip is the range.
              range="${{ github.sha }}~1..${{ github.sha }}"
            else
              range="$base..${{ github.sha }}"
            fi
          fi
          echo "checking commit identities in $range"
          node scripts/check-commit-identity.mjs "$range"
