# SonarCloud CI-based analysis (the `sonar` job in .github/workflows/ci.yml).
# Automatic Analysis cannot import coverage, so it must stay switched off in
# the SonarCloud project settings while this file drives the scan.
sonar.projectKey=JWE24-code_moqi
sonar.organization=jwe24-code

# lib/ is committed build output of src/ (see .gitignore) — analysing it would
# double every finding.
sonar.sources=src,scripts,bin,.github/workflows
sonar.tests=tests

# Only src/ is exercised by `npm run test:coverage`; scripts, the launcher and
# workflows are not unit-tested, so they stay out of the coverage figure.
sonar.coverage.exclusions=scripts/**,bin/**,.github/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
